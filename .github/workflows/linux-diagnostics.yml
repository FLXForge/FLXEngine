name: Linux diagnostics

on:
  push:
    branches: [feature/v0.4.0]
  pull_request:
    branches: [main, develop, feature/v0.4.0]
  workflow_dispatch:

permissions:
  contents: read

# A push and its PR share a group. Keep only the newest relevant run.
concurrency:
  group: linux-diagnostics-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'feature/v0.4.0' ||
      github.base_ref == 'feature/v0.4.0'
    name: Ubuntu 24.04 / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install development and virtual display dependencies
        id: setup
        timeout-minutes: 45
        run: |
          mkdir -p diagnostics
          # Ubuntu 24.04 uses deb822 .sources and mirror+file, not just sources.list.
          # https://github.com/actions/runner-images/issues/14594
          apt_sources=(/etc/apt/apt-mirrors.txt /etc/apt/sources.list)
          shopt -s nullglob
          apt_sources+=(/etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list)
          log_apt_sources() {
            local source
            for source in "${apt_sources[@]}"; do
              if [ -f "$source" ]; then
                printf '\n--- %s ---\n' "$source"
                cat "$source"
              fi
            done
          }
          log_apt_sources > diagnostics/apt-sources-before.log
          # Command-line options override image defaults. Never accept partial indexes.
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=60
            -o APT::Update::Error-Mode=any)
          packages=(build-essential clang cmake ninja-build git ca-certificates pkg-config
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
            libgl1-mesa-dev libasound2-dev xvfb xauth libgl1-mesa-dri)
          apt_attempt() {
            local attempt=$1
            timeout --kill-after=10s 120s sudo apt-get "${apt_options[@]}" update 2>&1 |
              tee "diagnostics/apt-update-$attempt.log" || return $?
            timeout --kill-after=10s 240s sudo apt-get "${apt_options[@]}" install \
              --yes --no-install-recommends "${packages[@]}" 2>&1 |
              tee "diagnostics/apt-install-$attempt.log"
          }
          if apt_attempt initial; then
            :
          else
            status=$?
            # Retry only an Azure acquisition failure (or a timeout with Azure configured).
            if grep -Eq '(Err:|Ign:|Failed to fetch|Temporary failure resolving).*azure\.archive\.ubuntu\.com' \
                diagnostics/apt-*-initial.log ||
                { [ "$status" -eq 124 ] && grep -q 'azure.archive.ubuntu.com' diagnostics/apt-sources-before.log; }; then
              echo '::warning::Azure APT mirror unavailable; retrying once with the official Ubuntu archive.'
              sudo python3 - <<'PY'
          import pathlib
          import re
          paths = [pathlib.Path('/etc/apt/apt-mirrors.txt'), pathlib.Path('/etc/apt/sources.list')]
          paths += sorted(pathlib.Path('/etc/apt/sources.list.d').glob('*.sources'))
          paths += sorted(pathlib.Path('/etc/apt/sources.list.d').glob('*.list'))
          changed = 0
          for path in paths:
              if not path.is_file():
                  continue
              original = path.read_text()
              # Change only this exact host/path; preserve suites, security, Signed-By,
              # mirror priorities and all other repositories. HTTPS keeps TLS verification.
              updated, count = re.subn(r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=[/\s]|$)',
                                       'https://archive.ubuntu.com/ubuntu', original)
              if count:
                  if path == pathlib.Path('/etc/apt/apt-mirrors.txt'):
                      # Azure's replacement already exists at priority 2 in this image.
                      # Keep the first archive entry and preserve every other mirror.
                      kept = []
                      archive_seen = False
                      for line in updated.splitlines(keepends=True):
                          fields = line.split()
                          if fields and fields[0].rstrip('/') == 'https://archive.ubuntu.com/ubuntu':
                              if archive_seen:
                                  continue
                              archive_seen = True
                          kept.append(line)
                      updated = ''.join(kept)
                  path.write_text(updated)
                  print(f'Updated {path}: {count} Azure URI(s)')
                  changed += count
          if not changed:
              raise SystemExit('No supported Azure APT URI found; refusing an unrelated fallback')
          PY
              log_apt_sources > diagnostics/apt-sources-after.log
              # Probe both configured Ubuntu hosts before retrying APT. Do not force an
              # address family, bypass DNS, follow redirects or relax certificate checks.
              probe_ubuntu_repositories() {
                local host suite dns_status https_status failed=0
                for host in archive.ubuntu.com security.ubuntu.com; do
                  suite=noble
                  if [ "$host" = security.ubuntu.com ]; then suite=noble-security; fi
                  printf '\nHost: %s; suite: %s\n' "$host" "$suite"
                  dns_status=0
                  timeout --kill-after=2s 10s getent ahosts "$host" || dns_status=$?
                  printf 'DNS exit code: %s\n' "$dns_status"
                  https_status=0
                  timeout --kill-after=2s 20s curl --silent --show-error --fail \
                    --proto '=https' --connect-timeout 5 --max-time 15 \
                    --output /dev/null \
                    --write-out 'HTTP=%{http_code} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TLS=%{time_appconnect}s TOTAL=%{time_total}s\n' \
                    "https://$host/ubuntu/dists/$suite/InRelease" || https_status=$?
                  printf 'HTTPS exit code: %s\n' "$https_status"
                  if [ "$dns_status" -ne 0 ] || [ "$https_status" -ne 0 ]; then
                    echo "::error::Ubuntu repository probe failed for $host (DNS=$dns_status, HTTPS=$https_status)."
                    failed=1
                  fi
                done
                return "$failed"
              }
              diagnose_resolver() {
                local host family result
                echo '--- Resolver configuration ---'
                cat /etc/resolv.conf
                grep '^hosts:' /etc/nsswitch.conf
                if command -v resolvectl >/dev/null; then
                  timeout --kill-after=2s 10s resolvectl status || echo "resolvectl status exit=$?"
                fi
                for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com packages.microsoft.com; do
                  for family in ahostsv4 ahostsv6; do
                    printf '\nDNS query: %s %s\n' "$host" "$family"
                    result=0
                    timeout --kill-after=2s 5s getent "$family" "$host" || result=$?
                    printf 'getent exit=%s\n' "$result"
                  done
                  if command -v resolvectl >/dev/null; then
                    timeout --kill-after=2s 5s resolvectl query "$host" || echo "resolvectl query exit=$?"
                  fi
                  if command -v dig >/dev/null; then
                    # Use the runner's existing resolver; never hardcode a DNS server.
                    dig +time=2 +tries=1 "$host" A || echo "dig A exit=$?"
                    dig +time=2 +tries=1 "$host" AAAA || echo "dig AAAA exit=$?"
                  fi
                done
              }
              if probe_ubuntu_repositories 2>&1 | tee diagnostics/apt-fallback-probes.log; then
                :
              else
                diagnose_resolver 2>&1 | tee diagnostics/apt-resolver.log
                {
                  # Query the runner's configured upstream directly, over both transports.
                  # Do not replace DNS servers or pin repository addresses.
                  while read -r upstream; do
                    for host in archive.ubuntu.com security.ubuntu.com; do
                      dig +time=2 +tries=1 "@$upstream" "$host" A || echo "upstream UDP exit=$?"
                      dig +tcp +time=2 +tries=1 "@$upstream" "$host" A || echo "upstream TCP exit=$?"
                    done
                  done < <(awk '$1 == "nameserver" { print $2 }' /run/systemd/resolve/resolv.conf)
                  for host in archive.ubuntu.com security.ubuntu.com; do
                    for family in --ipv4 --ipv6; do
                      printf '\nHTTPS diagnostic: %s %s\n' "$host" "$family"
                      timeout --kill-after=2s 20s curl "$family" --silent --show-error --fail \
                        --proto '=https' --connect-timeout 5 --max-time 15 \
                        --output /dev/null \
                        --write-out 'HTTP=%{http_code} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TLS=%{time_appconnect}s TOTAL=%{time_total}s\n' \
                        "https://$host/ubuntu/dists/noble/InRelease" || echo "curl exit=$?"
                    done
                  done
                } 2>&1 | tee diagnostics/apt-network.log
                echo '::error::Runner cannot reach the official Ubuntu repositories; inspect apt-resolver.log, apt-network.log and apt-fallback-probes.log. Refusing incomplete dependencies.'
                exit 1
              fi
              # A failed fallback remains fatal, including any third-party repository failure.
              if apt_attempt fallback; then
                :
              else
                status=$?
                echo "::error::APT fallback failed (exit=$status); inspect apt-update-fallback.log and apt-install-fallback.log if present. Exit 124 indicates the command watchdog expired."
                exit "$status"
              fi
            else
              exit "$status"
            fi
          fi
          {
            uname -a
            git rev-parse HEAD
            cat VERSION
            cmake --version
            "$CC" --version
            "$CXX" --version
            dpkg-query -W build-essential clang cmake ninja-build git ca-certificates pkg-config \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
              libgl1-mesa-dev libasound2-dev xvfb xauth libgl1-mesa-dri
          } > diagnostics/environment.log
          test "$(id -u)" != 0
          sha256sum --check tests/fixtures/format12-windows.sha256

      - name: Configure Release
        id: configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_SHARED_LIBS=OFF -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF \
            2>&1 | tee diagnostics/configure.log

      - name: Build core, CLI and all test consumers
        id: build
        run: cmake --build build --parallel 2 2>&1 | tee diagnostics/build.log

      - name: Headless CTest
        id: headless
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p diagnostics/headless
          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY FLX_TEST_HEADLESS=1 \
            ctest --test-dir build --no-tests=error --output-on-failure -j 1 \
              --output-junit "$PWD/diagnostics/headless/results.xml" \
              --output-log "$PWD/diagnostics/headless/ctest.log"
          status=$?
          cp build/Testing/Temporary/LastTest*.log diagnostics/headless/ 2>/dev/null
          exit "$status"

      - name: Xvfb graphics without physical audio
        id: graphics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p diagnostics/graphics
          set +e
          env -u FLX_TEST_HEADLESS xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir build --no-tests=error --output-on-failure -j 1 \
              -R '^flx-(runtime-(drawing|lifecycle)|engine-host|text-rasterization|session-silent-graphics)-tests$' \
              --output-junit "$PWD/diagnostics/graphics/results.xml" \
              --output-log "$PWD/diagnostics/graphics/ctest.log"
          status=$?
          cp build/Testing/Temporary/LastTest*.log diagnostics/graphics/ 2>/dev/null
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          # These five cases are required. A skipped graphics test is incomplete coverage.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("diagnostics/graphics/results.xml").findall(".//testcase")
          if len(cases) != 5 or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Xvfb coverage incomplete: inspect skipped or missing graphics tests")
          PY

      - name: CLI smoke and format-12 exchange fixture
        id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          {
            test "$(build/flx --version)" = "$(tr -d '\r\n' < VERSION)"
            build/flx --help
            for project in pong asteroids arkanoid invaders tank; do
              build/flx validate "examples/$project.flx"
              build/flx compile "--output=diagnostics/$project.flxc" "examples/$project.flx"
            done
            build/flx-format12-portability-tests
            build/flx-format12-portability-tests --write-fixture \
              "diagnostics/format12-linux-${{ matrix.compiler }}.flxc"
            ldd build/flx
          } 2>&1 | tee diagnostics/smoke.log

      - name: Package the validated GCC runtime
        id: package
        if: ${{ success() && matrix.compiler == 'GCC' && steps.headless.outcome == 'success' && steps.graphics.outcome == 'success' && steps.smoke.outcome == 'success' }}
        run: bash cmake/PackageLinuxDiagnostic.sh "$PWD" "$PWD/build" "$PWD/dist" 2>&1 | tee diagnostics/package.log

      - name: Upload Linux integration runtime
        if: ${{ success() && matrix.compiler == 'GCC' && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flx-${{ steps.package.outputs.version }}-linux-x86_64
          path: ${{ steps.package.outputs.archive }}
          retention-days: 7
          if-no-files-found: error

      - name: Summarize results and omissions
        if: ${{ !cancelled() }}
        env:
          SETUP: ${{ steps.setup.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          HEADLESS: ${{ steps.headless.outcome }}
          GRAPHICS: ${{ steps.graphics.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          lines = ["## Linux diagnostic results", ""]
          lines += [f"- {stage}: {os.environ[stage]}" for stage in
                    ("SETUP", "CONFIGURE", "BUILD", "HEADLESS", "GRAPHICS", "SMOKE", "PACKAGE")]
          for phase in ("headless", "graphics"):
              directory = pathlib.Path("diagnostics") / phase
              xml = directory / "results.xml"
              lines += ["", f"### {phase}"]
              if not xml.exists():
                  lines += ["Not executed: no CTest report was generated."]
                  continue
              cases = ET.parse(xml).findall(".//testcase")
              skipped = [c for c in cases if c.find("skipped") is not None]
              failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
              passed = len(cases) - len(skipped) - len(failed)
              lines += [f"Passed {passed}; failed {len(failed)}; skipped {len(skipped)}."]
              lines += [f"- SKIPPED {c.attrib['name']}" for c in skipped]
              lines += [f"- FAILED {c.attrib['name']}" for c in failed]
              internal = sorted({line.strip() for case in cases
                                 if case.find("skipped") is None
                                 for line in case.findtext("system-out", "").splitlines()
                                 if line.startswith("[SKIP]")})
              if internal:
                  lines += ["Internal cases omitted by a suite:"] + [f"- {s}" for s in internal]
          lines += ["", "Manual validation remains required for audible audio, physical input, "
                    "fullscreen/focus and native Wayland. Xvfb supplies no physical audio device."]
          output = "\n".join(lines) + "\n"
          pathlib.Path("diagnostics").mkdir(exist_ok=True)
          pathlib.Path("diagnostics/summary.md").write_text(output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(output)
          PY

      - name: Upload diagnostic logs and fixtures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-diagnostics-${{ matrix.compiler }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            diagnostics/
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/compile_commands.json

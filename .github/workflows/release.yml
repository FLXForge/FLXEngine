name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild (for example v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.tag }}"
          }
          else {
            $Tag = "${{ github.ref_name }}"
          }

          if ($Tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Release tag must use vX.Y.Z format. Received: $Tag"
            exit 1
          }

          echo "tag=$Tag" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Ensure tag is on main
        shell: pwsh
        run: |
          git fetch origin main

          $TagCommit = git rev-parse HEAD
          $MainContains = git branch -r --contains $TagCommit | Select-String "origin/main"

          if (-not $MainContains) {
            Write-Error "Tag ${{ steps.release.outputs.tag }} is not on main."
            exit 1
          }

      - name: Ensure tag matches VERSION
        shell: pwsh
        run: |
          $TagVersion = "${{ steps.release.outputs.tag }}".Substring(1)
          $FileVersion = (Get-Content VERSION -Raw).Trim()

          if ($TagVersion -ne $FileVersion) {
            Write-Error "Release tag must match VERSION. Tag: $TagVersion VERSION: $FileVersion"
            exit 1
          }

      - name: Build Release
        uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: build
          build-args: --config Release

      - name: Package release
        shell: pwsh
        run: |
          $Version = "${{ steps.release.outputs.tag }}"
          $PackageName = "flx-$Version-windows-x64"
          $PackageDir = "dist/$PackageName"

          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $PackageDir | Out-Null

          Copy-Item "build/Release/flx.exe" "$PackageDir/flx.exe" -Force

          Copy-Item "examples" "$PackageDir/examples" -Recurse -Force

          Copy-Item "docs/schemas" "$PackageDir/schemas" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "$PackageDir/scripts" | Out-Null
          Copy-Item "docs/scripts/flx.d.ts" "$PackageDir/scripts/flx.d.ts" -Force

          Copy-Item "README.md" "$PackageDir/README.md" -Force
          Copy-Item "LICENSE" "$PackageDir/LICENSE" -Force

          @"
          @echo off
          flx.exe examples\pong.flx
          pause
          "@ | Set-Content "$PackageDir\run_pong.bat"

          @"
          @echo off
          flx.exe examples\asteroids.flx
          pause
          "@ | Set-Content "$PackageDir\run_asteroids.bat"

          @"
          @echo off
          flx.exe examples\arkanoid.flx
          pause
          "@ | Set-Content "$PackageDir\run_arkanoid.bat"

          @"
          @echo off
          flx.exe examples\invaders.flx
          pause
          "@ | Set-Content "$PackageDir\run_invaders.bat"

          @"
          @echo off
          flx.exe examples\tank.flx
          pause
          "@ | Set-Content "$PackageDir\run_tank.bat"

          Compress-Archive `
            -Path "$PackageDir\*" `
            -DestinationPath "dist/$PackageName.zip" `
            -Force

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          overwrite_files: true
          files: |
            build/Release/flx.exe
            dist/flx-${{ steps.release.outputs.tag }}-windows-x64.zip
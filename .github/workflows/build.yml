name: Build

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Release
        uses: threeal/cmake-action@74db386e1dc69a6ac24d95bd87890d8476d4cd1b # v2.1.0
        with:
          build-dir: build
          build-args: --config Release

      - name: Run tests
        shell: pwsh
        working-directory: build
        env:
          FLX_TEST_HEADLESS: "1"
        run: ctest -C Release --output-on-failure

      - name: Test release validation guards
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseValidation.ps1 -ExecutablePath build/Release/flx.exe

      - name: Run CLI smoke tests
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseCli.ps1 -ExecutablePath build/Release/flx.exe

      - name: Upload EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flx-exe-windows-x64
          path: build/Release/flx.exe

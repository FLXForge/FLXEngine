name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release
        uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: build
          build-args: --config Release

      - name: Find EXE
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter *.exe

      - name: Package release folder
        shell: pwsh
        run: |
          $Version = "0.2.0"
          $PackageName = "FLXEngine-v$Version-windows-x64"
          $PackageDir = "dist/$PackageName"

          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $PackageDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$PackageDir/examples" | Out-Null

          Copy-Item "build/Release/FlxEngine.exe" "$PackageDir/FlxEngine.exe" -Force

          Copy-Item "examples/pong.flx" "$PackageDir/examples/pong.flx" -Force
          Copy-Item "examples/pong" "$PackageDir/examples/pong" -Recurse -Force
          Copy-Item "examples/asteroids.flx" "$PackageDir/examples/asteroids.flx" -Force
          Copy-Item "examples/asteroids" "$PackageDir/examples/asteroids" -Recurse -Force
          Copy-Item "examples/arkanoid.flx" "$PackageDir/examples/arkanoid.flx" -Force
          Copy-Item "examples/arkanoid" "$PackageDir/examples/arkanoid" -Recurse -Force

          if (Test-Path "schemas") {
            Copy-Item "schemas" "$PackageDir/doc/schemas" -Recurse -Force
          }

          if (Test-Path "scripts/flx.d.ts") {
            New-Item -ItemType Directory -Force -Path "$PackageDir/scripts" | Out-Null
            Copy-Item "scripts/flx.d.ts" "$PackageDir/doc/scripts/flx.d.ts" -Force
          }

          Copy-Item "README.md" "$PackageDir/README.md" -Force

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "$PackageDir/LICENSE" -Force
          }

          @"
          @echo off
          FlxEngine.exe run examples\project.flx
          pause
          "@ | Set-Content "$PackageDir\run_pong.bat"

          @"
          @echo off
          FlxEngine.exe run examples\project.flx
          pause
          "@ | Set-Content "$PackageDir\run_asteroids.bat"

          @"
          @echo off
          FlxEngine.exe run examples\project.flx
          pause
          "@ | Set-Content "$PackageDir\run_arkanoid.bat"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlxEngine-exe-windows-x64
          path: build/Release/FlxEngine.exe

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLXEngine-v0.2.0-windows-x64
          path: dist/FLXEngine-v0.2.0-windows-x64